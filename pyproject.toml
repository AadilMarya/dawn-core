# Workspace root. Each member is an independently installable distribution.
[tool.uv.workspace]
members = ["dawn_osc", "dawn_core"]

[tool.uv.sources]
dawn-osc = { workspace = true }

# The toolchain the gates run with. Pinned here so CI and a fresh checkout use
# the same linter instead of whatever happens to be on the machine's PATH.
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.16,<0.17", "mypy>=1.11,<2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dawn_core", "dawn_osc"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"dawn_osc/src/dawn_osc/remote_script/**" = ["UP", "E402", "E722", "W291", "F401", "I001"]
"dawn_osc/src/dawn_osc/remote_script/DAWN/pythonosc/**" = ["ALL"]

[tool.ruff.format]
exclude = ["dawn_osc/src/dawn_osc/remote_script/**"]
