name: Publish to PyPI

# Manual on purpose: the PyPI trusted publisher is not configured yet. Run this workflow
# from the Actions tab once it is, and only for a tag that has already been released.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dawn-core
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --extra dev
      - run: uv run pytest
      - run: uv build --all-packages --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
