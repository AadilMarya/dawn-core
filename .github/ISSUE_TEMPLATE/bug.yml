name: Bug report
description: Something does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, session files or private Set data.
  - type: input
    id: version
    attributes:
      label: dawn-core version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent / prompt
        - Tool behavior
        - OSC transport
        - Remote Script install
        - Packaging
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command, the prompt, and the result prefix you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A script or a tool call that reproduces it offline, if possible.
