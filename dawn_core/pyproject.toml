[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dawn-core"
version = "0.1.0"
description = "An open-source AI music agent for Ableton Live"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Aadil Marya"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "dawn-osc>=0.1.0",
    "pydantic>=2.0.0",
    "pydantic-ai-slim>=2.0,<3",
]

[project.urls]
Repository = "https://github.com/AadilMarya/dawn-core"
Documentation = "https://github.com/AadilMarya/dawn-core#readme"

[project.optional-dependencies]
openai = ["pydantic-ai-slim[openai]"]
anthropic = ["pydantic-ai-slim[anthropic]"]
google = ["pydantic-ai-slim[google]"]
ollama = ["pydantic-ai-slim[ollama]"]
all = ["pydantic-ai-slim[openai,anthropic,google,ollama]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv.sources]
dawn-osc = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/dawn_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
